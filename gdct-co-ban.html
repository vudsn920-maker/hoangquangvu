
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123d2b">
<title>Giáo dục chính trị - Phòng Hồ Chí Minh</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
  padding: 20px;
  color: #183b2c;

  background:
    linear-gradient(rgba(225,238,225,0.55), rgba(225,238,225,0.55)),
    url("background.jpg") center center / cover no-repeat fixed;

  position: relative;
  overflow-x: hidden;
}

/* HỌA TIẾT NỀN */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

body::before {
  width: 550px;
  height: 550px;
  top: -190px;
  right: -150px;
  border: 2px solid rgba(255,255,255,0.18);
  box-shadow:
    0 0 0 25px rgba(255,255,255,0.05),
    0 0 0 55px rgba(255,255,255,0.04),
    0 0 100px rgba(255,255,255,0.15);
}

body::after {
  width: 450px;
  height: 450px;
  bottom: -180px;
  left: -130px;
  border: 2px solid rgba(255,255,255,0.18);
  box-shadow:
    0 0 0 25px rgba(255,255,255,0.05),
    0 0 0 55px rgba(255,255,255,0.04),
    0 0 100px rgba(255,255,255,0.15);
}

/* TIÊU ĐỀ */
header {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 22px 20px;
  text-align: center;
  background: rgba(255,255,255,0.88);
  border-radius: 18px;
  box-shadow: 0 5px 18px rgba(25,65,50,0.12);
  border-bottom: 4px solid #c9a64d;
  backdrop-filter: blur(8px);
}

header h1 {
  color: #17452f;
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: 1px;
}

/* KHU VỰC CHÍNH */
section {
  position: relative;
  z-index: 1;
  max-width: 1150px;
  margin: 30px auto;
}

.back-button {
  display: inline-block;
  margin-bottom: 20px;
  padding: 11px 19px;
  background: #24543d;
  color: white;
  text-decoration: none;
  border-radius: 9px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(20,55,40,0.15);
  transition: 0.25s;
}

.back-button:hover {
  background: #347452;
  transform: translateY(-2px);
}

/* KHUNG SƠ ĐỒ */
.diagram {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 210px 1fr;
  grid-template-rows: 170px 210px 170px;
  grid-template-areas:
    ". top ."
    "left center right"
    ". bottom .";

  align-items: center;
  justify-items: center;
  gap: 10px;

  padding: 30px 25px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 28px;
  box-shadow: 0 12px 35px rgba(30,75,50,0.12);
  backdrop-filter: blur(8px);
  overflow: hidden;
}

/* HỌA TIẾT TRANG TRÍ */
.diagram::before {
  content: "";
  position: absolute;
  width: 490px;
  height: 490px;
  border: 1px dashed rgba(36,84,61,0.16);
  border-radius: 50%;
  pointer-events: none;
}

.diagram::after {
  content: "";
  position: absolute;
  width: 340px;
  height: 340px;
  border: 1px solid rgba(36,84,61,0.08);
  border-radius: 50%;
  pointer-events: none;
}

/* VỊ TRÍ CÁC HÌNH TRÒN */
.circle-top {
  grid-area: top;
}

.circle-left {
  grid-area: left;
}

.circle-right {
  grid-area: right;
}

.circle-bottom {
  grid-area: bottom;
}

/* HÌNH TRÒN CHỨC NĂNG */
.category {
  position: relative;
  z-index: 2;

  width: 145px;
  height: 145px;
  padding: 12px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  text-decoration: none;
  color: #fff;

  background: linear-gradient(145deg, #245c3e, #397c51);
  border: 4px solid #d5b65e;
  border-radius: 50%;

  box-shadow:
    0 9px 22px rgba(25,75,45,0.22),
    inset 0 0 0 4px rgba(255,255,255,0.12);

  transition: all 0.3s ease;
}

.category:hover {
  transform: scale(1.07);
  background: linear-gradient(145deg, #347b50, #174a31);
  box-shadow:
    0 14px 28px rgba(25,75,45,0.3),
    inset 0 0 0 4px rgba(255,255,255,0.18);
  border-color: #f0d58a;
}

.category-icon {
  font-size: 2rem;
  margin-bottom: 7px;
  line-height: 1.2;
}

.category h3 {
  font-size: 0.85rem;
  line-height: 1.3;
  font-weight: 800;
  color: #fff;
}

.category p {
  margin-top: 4px;
  font-size: 0.68rem;
  line-height: 1.3;
  color: #e4f0e5;
}

/* KHỐI TRUNG TÂM */
.main-node {
  grid-area: center;
  position: relative;
  z-index: 3;

  width: 190px;
  height: 190px;
  padding: 18px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  color: white;
  background: linear-gradient(145deg, #153b70, #2867a7);
  border: 5px solid #d9b65d;
  border-radius: 50%;

  box-shadow:
    0 12px 30px rgba(20,55,100,0.28),
    inset 0 0 0 5px rgba(255,255,255,0.12);
}

.main-node::before {
  content: "";
  position: absolute;
  width: 155px;
  height: 155px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  pointer-events: none;
}

.main-icon {
  font-size: 2.8rem;
  margin-bottom: 8px;
  position: relative;
}

.main-node h2 {
  font-size: 1.1rem;
  line-height: 1.35;
  letter-spacing: 0.5px;
  position: relative;
}

.main-node p {
  margin-top: 7px;
  font-size: 0.72rem;
  color: #e4edff;
  line-height: 1.4;
  position: relative;
}

/* CHÚ THÍCH */
.note {
  margin-top: 25px;
  padding: 17px 20px;
  text-align: center;
  color: #405e49;
  background: rgba(255,255,255,0.78);
  border-radius: 12px;
  font-size: 0.95rem;
  border-left: 5px solid #c9a64d;
  box-shadow: 0 5px 15px rgba(30,75,50,0.07);
}

/* ĐIỆN THOẠI */
@media(max-width: 800px) {
  body {
    padding: 12px;
    background-attachment: scroll;
  }

  header h1 {
    font-size: 1.35rem;
  }

  .diagram {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "top top"
      "left right"
      "center center"
      "bottom bottom";

    gap: 20px 10px;
    padding: 25px 12px;
  }

  .diagram::before {
    width: 350px;
    height: 350px;
  }

  .diagram::after {
    width: 250px;
    height: 250px;
  }

  .category {
    width: 125px;
    height: 125px;
    padding: 10px;
  }

  .category-icon {
    font-size: 1.7rem;
    margin-bottom: 5px;
  }

  .category h3 {
    font-size: 0.75rem;
  }

  .category p {
    font-size: 0.62rem;
  }

  .main-node {
    width: 175px;
    height: 175px;
  }

  .main-node::before {
    width: 140px;
    height: 140px;
  }

  .main-node h2 {
    font-size: 1rem;
  }

  .main-icon {
    font-size: 2.4rem;
  }
}

@media(max-width: 360px) {
  .category {
    width: 115px;
    height: 115px;
  }

  .category h3 {
    font-size: 0.7rem;
  }

  .category p {
    font-size: 0.58rem;
  }
}
</style>
</head>
